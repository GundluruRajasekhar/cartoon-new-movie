<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip and the Moon Kite - Cartoon Movie</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1330;--ink:#fff4d6;--fox:#ff7a3d;--kite:#2ec4b6;--moon:#ffe9a8;--panel:#1b2150}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 4px;font-weight:600}
.sub{margin:0 0 16px;opacity:.8}
.screen{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:0 10px 40px #0008}
svg{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0f1330cc;transition:opacity .6s}
.overlay.hide{opacity:0;pointer-events:none}
.overlay h2{font-size:clamp(1.6rem,5vw,3rem);margin:0 0 12px;font-weight:600}
button{font:inherit;color:#1a1a1a;background:var(--moon);border:0;border-radius:999px;padding:10px 22px;cursor:pointer;font-weight:600}
button:hover{background:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
details{margin:0 0 14px;opacity:.9}summary{cursor:pointer;margin-bottom:6px}ol{line-height:1.6;max-width:60ch}
button:focus-visible,input:focus-visible{outline:3px solid var(--kite);outline-offset:3px}
.cap{min-height:3.2em;margin:16px 0 8px;font-size:clamp(1.1rem,2.6vw,1.5rem);line-height:1.4;max-width:60ch}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);padding:12px 16px;border-radius:14px}
.bar input[type=range]{flex:1;min-width:140px;accent-color:var(--fox)}
.time{font-variant-numeric:tabular-nums;opacity:.8}
label{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<main>
<h1>Pip and the Moon Kite</h1>
<p class="sub">A 40-second cartoon movie, drawn and animated entirely in this page.</p>
<div class="screen">
<svg id="stage" viewBox="0 0 800 450" role="img" aria-label="Animated cartoon: a fox cub flies a kite up to the moon">
<defs>
<radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".7"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
</defs>
<rect id="sky" width="800" height="450"/>
<g id="stars"></g>
<g id="moon" transform="translate(640 100)">
<circle r="120" fill="url(#glow)"/>
<circle r="55" fill="#ffe9a8"/>
<circle cx="-20" cy="-18" r="9" fill="#f2d98a"/><circle cx="24" cy="22" r="12" fill="#f2d98a"/><circle cx="28" cy="-24" r="6" fill="#f2d98a"/>
<g id="mface" opacity="0"><g id="meyes"><circle cx="-16" cy="-4" r="5" fill="#4a3b1a"/><circle cx="16" cy="-4" r="5" fill="#4a3b1a"/></g>
<path d="M-18 14 Q0 30 18 14" stroke="#4a3b1a" stroke-width="4" fill="none" stroke-linecap="round"/></g>
</g>
<path id="hills" d="M0 450V350Q150 290 300 345T600 335T800 350V450Z"/>
<line id="string" stroke="#fff4d6" stroke-width="2"/>
<g id="kite">
<path d="M0 38Q-14 70 4 90T-4 130" stroke="#fff4d6" stroke-width="2" fill="none"/>
<circle cx="-1" cy="62" r="5" fill="#ff7a3d"/><circle cx="3" cy="96" r="5" fill="#ffd166"/>
<polygon points="0,-34 26,0 0,38 -26,0" fill="#2ec4b6" stroke="#0f1330" stroke-width="3" stroke-linejoin="round"/>
<path d="M0 -34V38M-26 0H26" stroke="#0f1330" stroke-width="2"/>
<g id="gift" transform="translate(-4 134) scale(0)"><polygon points="0,-14 4,-4 15,-4 6,3 9,14 0,7 -9,14 -6,3 -15,-4 -4,-4" fill="#ffe14d" stroke="#e0a800" stroke-width="2"/></g>
</g>
<g id="pip">
<g id="tail"><path d="M-14 -22Q-52 -34 -44 -62Q-30 -48 -10 -38Z" fill="#ff7a3d"/><path d="M-44 -62Q-40 -52 -34 -52Q-38 -58 -44 -62Z" fill="#fff"/></g>
<rect x="-14" y="-12" width="9" height="12" rx="4" fill="#d9531e"/><rect x="5" y="-12" width="9" height="12" rx="4" fill="#d9531e"/>
<ellipse cy="-28" rx="20" ry="26" fill="#ff7a3d"/><ellipse cx="3" cy="-24" rx="11" ry="17" fill="#fff4d6"/>
<line x1="12" y1="-40" x2="24" y2="-56" stroke="#ff7a3d" stroke-width="7" stroke-linecap="round"/>
<polygon points="-18,-76 -12,-102 -2,-80" fill="#ff7a3d"/><polygon points="18,-76 12,-102 2,-80" fill="#ff7a3d"/>
<circle cy="-66" r="20" fill="#ff7a3d"/><ellipse cx="3" cy="-58" rx="12" ry="9" fill="#fff4d6"/>
<circle cx="-6" cy="-70" r="3.5" fill="#222"/><circle cx="9" cy="-70" r="3.5" fill="#222"/><circle cx="5" cy="-60" r="3" fill="#222"/>
</g>
<g id="end" opacity="0"><rect width="800" height="450" fill="#0f1330" opacity=".75"/><text x="400" y="225" text-anchor="middle" font-family="Fredoka,Trebuchet MS,sans-serif" font-size="64" fill="#ffe9a8">The End</text><text x="400" y="270" text-anchor="middle" font-family="Fredoka,Trebuchet MS,sans-serif" font-size="22" fill="#fff4d6">Come back tomorrow, Pip.</text></g>
</svg>
<div class="overlay" id="intro"><h2>Pip and the Moon Kite</h2><button id="start">Start movie</button></div>
</div>
<p class="cap" id="cap" aria-live="polite"></p>
<details><summary>Full narration script</summary><ol id="script"></ol></details>
<div class="bar">
<button id="go">Start</button><button id="stop" disabled>Stop</button>
<span class="time" id="time">0:00 / 0:40</span>
<label><input type="checkbox" id="voice" checked> Narration voice</label>
<label><input type="checkbox" id="music" checked> Music</label>
</div>
</main>
<script>
const D=40,$=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,seg=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function mix(keys,t){let i=0;while(i<keys.length-2&&t>keys[i+1][0])i++;const k=clamp((t-keys[i][0])/(keys[i+1][0]-keys[i][0])),a=hex(keys[i][1]),b=hex(keys[i+1][1]);return 'rgb('+a.map((v,j)=>Math.round(lerp(v,b[j],k))).join(',')+')'}
const SKY=[[0,'#ff9a5c'],[10,'#7a4fa0'],[20,'#232a63'],[40,'#141a4a']],HILL=[[0,'#4aa564'],[20,'#1f4d45'],[40,'#16363a']];
const CAPS=[[0,'Pip the little fox loved kites. Tonight, he built his biggest one yet.'],[8,'A gust of wind! Up, up, up went the kite, and Pip ran after it.'],[18,'The kite pulled so high that Pip\'s paws left the ground.'],[28,'The Moon opened its sleepy eyes. "Hello, Pip," it said.'],[31,'It gave him a tiny star for the kite\'s tail. "Come back tomorrow."'],[36,'Pip floated home, smiling all the way.']];
const stars=[];for(let i=0;i<40;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');const s={c,p:Math.random()*6};c.setAttribute('cx',Math.random()*800);c.setAttribute('cy',Math.random()*260);c.setAttribute('r',1+Math.random()*1.6);c.setAttribute('fill','#fff4d6');$('stars').appendChild(c);stars.push(s)}
let t=0,playing=false,last=0,capIdx=-1;
function frame(){
$('sky').setAttribute('fill',mix(SKY,t));$('hills').setAttribute('fill',mix(HILL,t));
const so=clamp((t-9)/10);stars.forEach(s=>s.c.setAttribute('opacity',so*(.6+.4*Math.sin(t*3+s.p))));
let x,y;
if(t<8){x=200;y=330}else if(t<18){x=lerp(200,520,seg(t,8,18));y=330-Math.abs(Math.sin((t-8)*3))*14*(1-seg(t,16,18))}
else if(t<30){x=lerp(520,560,seg(t,18,30));y=lerp(330,230,seg(t,18,30))}
else if(t<36){x=560;y=230+Math.sin((t-30)*2)*6}
else{x=lerp(560,300,seg(t,36,40));y=lerp(230,330,seg(t,36,40))}
$('pip').setAttribute('transform',`translate(${x} ${y})`);
$('tail').setAttribute('transform',`rotate(${Math.sin(t*6)*8} -14 -22)`);
const k=seg(t,6,14),up=lerp(40,120,k),sw=Math.sin(t*2)*10*k,kx=x+40+sw,ky=y-70-up;
$('kite').setAttribute('transform',`translate(${kx} ${ky}) rotate(${sw*.8})`);
const s=$('string');s.setAttribute('x1',x+22);s.setAttribute('y1',y-54);s.setAttribute('x2',kx);s.setAttribute('y2',ky+38);
$('mface').setAttribute('opacity',seg(t,27,29));
$('meyes').setAttribute('transform',`translate(0 -4) scale(1 ${Math.sin(t*1.7)>.97?.1:1}) translate(0 4)`);
const g=seg(t,31,33);$('gift').setAttribute('transform',`translate(-4 134) scale(${g*(1+.2*Math.sin(t*5))})`);
$('end').setAttribute('opacity',seg(t,37,39));
let ci=0;CAPS.forEach((c,i)=>{if(t>=c[0])ci=i});
if(ci!==capIdx){capIdx=ci;$('cap').textContent=CAPS[ci][1];if(playing)speak(CAPS[ci][1])}
const f=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');$('time').textContent=f(t)+' / '+f(D);
}
function loop(now){if(playing){t=Math.min(D,t+(now-last)/1000);if(t>=D){playing=false;stopMusic();setBtns()}}last=now;frame();requestAnimationFrame(loop)}
function setBtns(){$('go').disabled=playing;$('stop').disabled=!playing}
function speak(text){if(!$('voice').checked||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;u.pitch=1.15;const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
let ac,musTimer,step=0;const NOTES=[262,330,392,330,294,349,440,349];
function startMusic(){stopMusic();if(!$('music').checked)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();musTimer=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type='triangle';o.frequency.value=NOTES[step++%8];g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.05,n+.05);g.gain.exponentialRampToValueAtTime(.0001,n+.9);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+1)},600)}
function stopMusic(){clearInterval(musTimer)}
function start(){t=0;capIdx=-1;playing=true;$('intro').classList.add('hide');setBtns();startMusic()}
function stop(){playing=false;t=0;capIdx=-1;if('speechSynthesis' in window)speechSynthesis.cancel();stopMusic();setBtns();$('intro').classList.remove('hide');frame()}
$('start').onclick=start;$('go').onclick=start;$('stop').onclick=stop;
$('voice').onchange=()=>{if(!$('voice').checked&&'speechSynthesis' in window)speechSynthesis.cancel()};
$('music').onchange=()=>{$('music').checked&&playing?startMusic():stopMusic()};
CAPS.forEach(c=>{const li=document.createElement('li');li.textContent=c[1];$('script').appendChild(li)});
if('speechSynthesis' in window)speechSynthesis.getVoices();
frame();requestAnimationFrame(loop);
</script>
</body>
</html>
